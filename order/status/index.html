<!doctype html>
<html lang="af">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Bestellingstatus | Briljante Boeke</title>
    <link rel="icon" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/roboto.css" />
    <link rel="stylesheet" href="/assets/phase1.css" />
  </head>
  <body class="status-page">
    <header class="phase-header"><div class="phase-header-inner"><a href="/"><img src="/assets/images/logo-white.png" alt="Briljante Boeke" /></a><div class="header-actions"><span>Bestellingstatus</span><div class="language-switch" aria-label="Language"><button type="button" data-language="af">AF</button><button type="button" data-language="en">EN</button></div></div></div></header>
    <main class="status-shell">
      <section class="status-card" aria-live="polite">
        <div id="status-icon" class="status-icon">…</div>
        <p class="phase-label">BESTELLING <span id="status-reference"></span></p>
        <h1 id="status-title">Betaling word nagegaan</h1>
        <p id="status-copy">PayFast se bevestiging kan ’n kort rukkie neem. Hierdie bladsy sal outomaties bywerk.</p>
        <dl id="status-details" hidden><div><dt>Skool</dt><dd id="status-school"></dd></div><div><dt>Bedrag</dt><dd id="status-amount"></dd></div></dl>
        <button id="status-retry" class="btn btn-primary" type="button" aria-controls="status-retry-confirmation" aria-expanded="false" hidden>Probeer betaling weer</button>
        <div id="status-retry-confirmation" class="notice-card" role="group" aria-labelledby="status-retry-confirm-title" aria-describedby="status-retry-warning" hidden>
          <p id="status-retry-confirm-title" class="phase-label"></p>
          <p id="status-retry-warning"></p>
          <div class="button-row"><button id="status-retry-cancel" class="btn btn-outline" type="button">Kanselleer</button><button id="status-retry-confirm" class="btn btn-primary" type="button">Gaan voort met PayFast</button></div>
        </div>
        <p id="status-retry-message" role="status"></p>
        <a class="btn btn-outline" href="/">Terug na Briljante Boeke</a>
      </section>
    </main>
    <script type="module" src="/assets/order-status.js"></script>
  </body>
</html>
